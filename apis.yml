aid: rivus-pharmaceuticals
name: Rivus Pharmaceuticals
description: 'Rivus Pharmaceuticals is a privately held clinical-stage biopharmaceutical company
  founded in 2019, with corporate offices in South San Francisco, California and research
  operations in Charlottesville, Virginia. Grounded in mitochondrial biology, it develops oral
  small-molecule controlled metabolic accelerators for obesity and associated cardio-metabolic
  disease. Lead candidate HU6 is in Phase 2 development for metabolic dysfunction-associated
  steatohepatitis (MASH) and has reported Phase 2a data in obesity-related heart failure with
  preserved ejection fraction (HFpEF); RV-8451, an oral non-peptide GLP-1 receptor agonist for
  obesity, is in IND-enabling studies. Rivus is a therapeutics developer, not a software or
  technology vendor: it publishes no developer program, public API, SDK or machine-readable
  specification of any kind.'
